services:
  migrate:
    image: ghcr.io/cewilliams95/nerocopia:latest
    restart: "no"
    command: php artisan migrate --force
    env_file:
      - .env.prod
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/cewilliams95/nerocopia:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    image: ghcr.io/cewilliams95/nerocopia:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env.prod
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    image: ghcr.io/cewilliams95/nerocopia:latest
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env.prod
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  assets:
    image: ghcr.io/cewilliams95/nerocopia:latest
    restart: "no"
    user: "root"
    entrypoint: ["/bin/sh"]
    command: ["-c", "cp -a /var/www/html/public/. /shared-public/"]
    volumes:
      - public_assets:/shared-public

  web:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - public_assets:/var/www/html/public:ro
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
      assets:
        condition: service_completed_successfully

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

  backup:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - db_backups:/backups
    depends_on:
      db:
        condition: service_healthy
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        while true; do
          ts=$$(date +%Y%m%d_%H%M%S)
          dbname="$$MYSQL_DATABASE"
          echo "[backup] dumping $$dbname at $$ts"
          mysqldump -h db -u root -p"$$MYSQL_ROOT_PASSWORD" \
            --single-transaction --routines --triggers "$$dbname" \
            | gzip > "/backups/$${dbname}_$${ts}.sql.gz"
          find /backups -name '*.sql.gz' -mtime +14 -delete
          echo "[backup] done, sleeping 24h"
          sleep 86400
        done

volumes:
  db_data:
  db_backups:
  storage:
  public_assets:
