services:
  migrate:
    image: ghcr.io/cewilliams95/nerocopia:latest
    restart: "no"
    command: php artisan migrate --force
    env_file:
      - .env.prod
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy

  app:
    image: ghcr.io/cewilliams95/nerocopia:latest
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  queue:
    image: ghcr.io/cewilliams95/nerocopia:latest
    restart: unless-stopped
    command: php artisan queue:work --sleep=3 --tries=3 --max-time=3600
    env_file:
      - .env.prod
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  scheduler:
    image: ghcr.io/cewilliams95/nerocopia:latest
    restart: unless-stopped
    command: php artisan schedule:work
    env_file:
      - .env.prod
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      migrate:
        condition: service_completed_successfully

  db:
    image: mysql:8.4
    restart: unless-stopped
    env_file:
      - .env.prod
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data:
  storage:
